    x-apievangelist-harvested: '2026-07-25'
    x-apievangelist-source: https://www.cycleplan.co.uk/umbraco/swagger/delivery/swagger.json
    x-apievangelist-classification: cms-content-infrastructure
    x-apievangelist-note: >-
      Read-only content and media for the Cycleplan bike-insurance brand. Not an
      insurance API. Cycleplan is also the brand behind Ripe's April 2026 ChatGPT app,
      but that conversational quote surface is private and unrelated to this API.
