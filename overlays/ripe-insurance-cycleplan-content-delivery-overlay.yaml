overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Cycleplan Umbraco Content Delivery API
  version: 1.0.0
x-apievangelist:
  generated: '2026-07-25'
  method: generated
  source: openapi/ripe-insurance-cycleplan-content-delivery-openapi.json
  note: >-
    Cycleplan is a Ripe Insurance brand. Its Umbraco build is one version behind the
    flagship site, so it still exposes the eight legacy v1 operations alongside the
    eight v2 ones — sixteen in total against eight on ripeinsurance.co.uk. This overlay
    records the production server, the provenance, and the v1 deprecation reality the
    vendor specification does not state.
extends: openapi/ripe-insurance-cycleplan-content-delivery-openapi.json
