docs: https://docs.umbraco.com/umbraco-cms/reference/content-delivery-api
note: >-
  The entity graph derived from components.schemas $ref links in the two harvested
  Umbraco Content Delivery API specifications. This is a CONTENT model (pages, media,
  crops, routes), not an insurance domain model. No Policy, Quote, Risk, Claim,
  Coverage, Premium or Party entity exists anywhere in Ripe's public surface — the
  insurance data model is entirely private. Schema names differ between hosts: the
  3.0.4 spec on ripeinsurance.co.uk uses the `Api*` prefix, the 3.0.1 spec on
  cycleplan.co.uk uses the `IApi*` interface prefix for the same shapes.
domain: content-management
entities:
- name: ApiContentResponseModel
  alias_on_cycleplan: IApiContentResponseModel
  description: A single published content item (a page on a Ripe brand website).
  identifier: {field: id, type: string, format: uuid}
  required: [id, contentType, properties, name, createDate, updateDate, route, cultures]
  fields:
  - {name: id, type: uuid}
