  - {name: createDate, type: date-time}
  - {name: updateDate, type: date-time}
  - {name: properties, type: object, note: open map, additionalProperties nullable — the actual page payload is untyped}
  - {name: cultures, type: map<string, ApiContentRouteModel>}
  - {name: route, type: ApiContentRouteModel}
  returned_by: [GetContent2.0, GetContentItemById2.0, GetContentItemByPath2.0, GetContentItems2.0]
- name: ApiContentRouteModel
  alias_on_cycleplan: IApiContentRouteModel
