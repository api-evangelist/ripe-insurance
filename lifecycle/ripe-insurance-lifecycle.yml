  versioning that exists is the URI-path version segment the Umbraco CMS emits, and the
  only observable lifecycle event is that v1 has been retired on ripeinsurance.co.uk
  while it is still live on cycleplan.co.uk, golfcare.co.uk and insure4sport.co.uk —
  an unannounced, undocumented, per-host divergence.
