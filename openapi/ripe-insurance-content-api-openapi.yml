components:
  schemas:
    IApiContentResponseModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contentType:
          type: string
          readOnly: true
        properties:
          type: object
          additionalProperties: {}
          readOnly: true
        name:
          type:
          - string
          - 'null'
          readOnly: true
        createDate:
          type: string
          format: date-time
          readOnly: true
        updateDate:
          type: string
          format: date-time
          readOnly: true
        route:
          $ref: '#/components/schemas/IApiContentRouteModel'
        cultures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IApiContentRouteModel'
          readOnly: true
      additionalProperties: false
    PagedIApiContentResponseModel:
      required:
      - items
      - total
      type: object
      properties:
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/IApiContentResponseModel'
      additionalProperties: false
    IApiContentRouteModel:
      type: object
      properties:
        path:
          type: string
          readOnly: true
        queryString:
          type:
          - string
          - 'null'
        startItem:
          $ref: '#/components/schemas/IApiContentStartItemModel'
      additionalProperties: false
    IApiContentStartItemModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        path:
          type: string
          readOnly: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ApiContentRouteModel:
      required:
      - path
      - startItem
      type: object
      properties:
        path:
          type: string
        queryString:
          type:
          - string
          - 'null'
        startItem:
          oneOf:
          - $ref: '#/components/schemas/ApiContentStartItemModel'
      additionalProperties: false
    ApiContentResponseModel:
