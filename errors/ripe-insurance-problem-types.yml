gaps:
- No published error-code registry or error reference page authored by Ripe.
- The `type` field is nullable and no problem-type URIs are minted, so errors are not machine-classifiable beyond HTTP status.
- 401, 403 and 404 declare no response body, so a client cannot rely on a ProblemDetails payload for those statuses.
- Error responses are not served as application/problem+json.
