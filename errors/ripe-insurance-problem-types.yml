note: >-
  Derived from the 4xx responses declared in the two harvested Umbraco Content Delivery
  API specifications. The error body is the ASP.NET Core ProblemDetails object — RFC
  7807 shaped (type, title, status, detail, instance, plus additionalProperties) but
  served as application/json rather than application/problem+json, so it does not meet
  RFC 9457 content-type negotiation. Ripe publishes no error reference of its own; there
  is no registry of typed error URIs, and the `type` field is nullable. Only the 400
  responses carry a declared response body — 401, 403 and 404 are declared with no
  content at all. No insurance error catalog exists because no insurance API exists.
