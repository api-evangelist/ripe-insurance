  api_key_in: [header]
  oauth2_flows: [authorizationCode, clientCredentials, refreshToken]
  developer_credentials_available: false
  note: >-
    Ripe Insurance issues NO developer or partner credentials. There is no sign-up for
    API access, no key-management console and no client-registration endpoint. What
    exists is (a) an anonymous, unauthenticated read surface on the Umbraco Content
    Delivery API and (b) an OpenID Connect server for website customer login. The
    apiKey scheme below is an optional Umbraco platform feature declared as a header
    parameter in the specification — it is NOT declared as an OpenAPI securityScheme
    and no key is obtainable by an outside developer.
schemes:
- name: anonymous
  type: none
  description: >-
    The Content Delivery API is served anonymously. All eight v2 operations on
    ripeinsurance.co.uk (and sixteen v1+v2 operations on cycleplan.co.uk) return 200
    with no credential. Verified live 2026-07-25 against
    /umbraco/delivery/api/v2/content (345 content items returned).
  sources:
  - openapi/ripe-insurance-umbraco-content-delivery-openapi.json
  - openapi/ripe-insurance-cycleplan-content-delivery-openapi.json
- name: Api-Key
  type: apiKey
  in: header
  parameter_name: Api-Key
  declared_as_security_scheme: false
  description: >-
    Umbraco platform feature. Declared in the specification as an optional request
    header on every operation ("API key specified through configuration to authorize
    access to the API") rather than in components.securitySchemes. It gates
    configuration-level access to the Delivery API. Ripe publishes no way to obtain
    one.
  sources:
  - openapi/ripe-insurance-umbraco-content-delivery-openapi.json
  - openapi/ripe-insurance-cycleplan-content-delivery-openapi.json
- name: umbraco-member-oidc
  type: openIdConnect
  openIdConnectUrl: https://www.ripeinsurance.co.uk/.well-known/openid-configuration
  description: >-
    The Umbraco/OpenIddict member-authentication server behind the Ripe Insurance
    customer login (www.ripeinsurance.co.uk/login redirects to
    account.ripeinsurance.co.uk). It protects member-only website content, including
    member-protected items served by the Content Delivery API — the reason
    GetContentItemById2.0 and GetContentItemByPath2.0 declare 401 and 403 responses.
    It is a consumer login system, not a partner API authorization server.
  issuer: https://www.ripeinsurance.co.uk/
  endpoints:
