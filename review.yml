aid: ripe-insurance
name: Ripe Insurance
review:
  question: Does Ripe Insurance expose a public, self-serve developer portal or documented
    insurance API (quote, bind, issue, or FNOL)?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: insurtech-dtc
  gated: true
findings:
  summary: |
    Ripe Insurance Services Limited (trading as Ripe, part of Ripe Thinking Limited,
    FCA FRN 313411) is a Stockport-based UK digital MGA selling specialist personal
    and small-commercial lines direct to consumers under Cycleplan, Golf Care,
    Insure4Boats, Insure4Sport and Ripe Caravans. It publishes NO public developer
    portal and NO documented insurance API. Every conventional developer host and
    path was probed on 2026-07-25 and none resolved to a developer surface:
    developer., developers., docs. and api. subdomains do not resolve at all (DNS
    failure, curl exit 000), and /developers, /developer, /partners and /integrations
    all return 404 on the primary domain.

    The only integration path Ripe offers is commercial, not technical: the corporate
    site's "Partner with Us" page (https://www.ripethinking.co.uk/partner-with-us/)
    is a business-development enquiry form with an enquiry-type dropdown and an
    invitation to meet at their Manchester office. It carries no technical
    documentation, no specification, no sandbox, and no onboarding path. The
    "Technology" page markets an in-house platform in outcome language ("we develop
    our products, pricing matrixes and websites in-house meaning we can bring products
    to market faster") and does not name a single API, integration protocol, or vendor.
    This is a partner/BD wall, so gated is recorded as true.

    ONE real, anonymously reachable, machine-readable API surface exists and was
    harvested verbatim: the Umbraco CMS Content Delivery API. This is boilerplate
    that ships with the Umbraco .NET CMS powering the marketing and quote sites — it
    is read-only website content and media, NOT an insurance API. It is recorded
    because it is genuinely public and parses, and because the same surface is
    present across the Ripe brand estate, but it must not be read as an insurance
    API programme. Ripe neither documents nor promotes it, and robots.txt carries
    "Disallow: /umbraco/".

    Quote and bind at Ripe happen entirely inside first-party consumer web funnels.
    The one notable distribution innovation is the Cycleplan ChatGPT app announced
    28 April 2026 — described by Ripe as a UK-first for a digital MGA, delivering a
    real-time confirmed cycling-insurance quote conversationally and clicking through
    to the Cycleplan declarations and payment page. It was built in-house; no MCP
    server, OpenAI Apps SDK detail, public endpoint, or specification was published,
    so it adds no public API surface.

    ACORD posture: no ACORD reference found. The strings ACORD, AL3, ACORD XML, NGDS,
    IVANS, Vertafore and Applied Epic return zero hits across ripeinsurance.co.uk and
    ripethinking.co.uk including the technology, partner and about pages. This is
    consistent with a direct-to-consumer digital MGA that owns its own distribution
    and never touches the agency-download rails ACORD standards serve.
