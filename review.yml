  marketContext: |
    The United Kingdom has the FCA and PRA but no open-insurance obligation; the FCA's
    Open Finance work remains consultation rather than rule. The UK's genuine
    market-wide data and API infrastructure effort is the London Market modernisation
    programme (Blueprint Two, PPL, Whitespace, Ki), which is aimed at brokers and
    syndicates rather than developers and is therefore invisible from outside. Ripe
    sits in the other UK cluster — the dense insurtech D2C cluster alongside Zego,
    Marshmallow, Cuvva and Superscript — and its posture confirms the pattern: a
    digital MGA that invests heavily in its own distribution technology and channels
    while publishing nothing an external developer can consume.
