  reason: |
    Recorded as an honest stub. Ripe Insurance publishes no developer portal and no
    insurance API; the only public machine-readable surface is CMS infrastructure
    that ships with Umbraco, harvested verbatim and labelled as such so it is never
    mistaken for a quote, bind, issue, or FNOL capability. ACORD posture is a clean
    negative. This is the correct and expected outcome for a UK direct-to-consumer
    digital MGA in a market with no open-insurance mandate.
