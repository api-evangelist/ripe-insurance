  insuranceVerbs:
    quote:
      exposedAsAPI: false
      note: Quoting is available only through first-party consumer web funnels and,
        since 28 April 2026, the Cycleplan ChatGPT app. No public quote endpoint or
        specification is published.
    bind:
      exposedAsAPI: false
      note: Bind and payment complete on the brand websites. No public API.
    issue:
      exposedAsAPI: false
      note: Policy issuance and documents are delivered through the customer login
        area. No public API.
    fnol:
      exposedAsAPI: false
      note: Claims are notified through the how-to-claim page and per-brand claims
        lines, not an API.
    audience: consumer-facing web and conversational channels only; no agent-facing
      or partner-facing API surface is published.
  authModel:
    scheme: OAuth2 / OpenID Connect (site members only)
    issuer: https://www.ripeinsurance.co.uk/
    discovery: https://www.ripeinsurance.co.uk/.well-known/openid-configuration
    grantTypesSupported:
    - authorization_code
    - refresh_token
    - client_credentials
    scopesSupported:
    - openid
    - offline_access
    codeChallengeMethods:
    - plain
    - S256
    idTokenSigningAlg:
    - RS256
    jwks: https://www.ripeinsurance.co.uk/.well-known/jwks
    note: This is the Umbraco member-authentication server (OpenIddict) that fronts
      the website customer login, not a partner or developer API authorization server.
      No API keys, no developer credentials, and no client registration are offered
      publicly. The harvested Content Delivery API requires no authentication at all.
  webhooks:
